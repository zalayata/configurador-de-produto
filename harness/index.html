<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bancada — modelos do catálogo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1d26; color: #c9d3da; font: 13px/1.4 system-ui, sans-serif; }
      body.claro { background: #e9ecef; color: #14191c; }
      #palco { position: fixed; inset: 0; }
      #legenda { position: fixed; left: 16px; top: 16px; display: grid; gap: 4px; padding: 10px 12px; background: rgba(8, 19, 26, 0.72); border: 1px solid rgba(201, 211, 218, 0.16); border-radius: 6px; }
      body.claro #legenda { background: rgba(255, 255, 255, 0.85); border-color: rgba(0, 0, 0, 0.12); }
      .item { display: flex; align-items: center; gap: 8px; }
      .cor { width: 12px; height: 12px; border-radius: 2px; }
      #info { position: fixed; right: 16px; bottom: 16px; text-align: right; opacity: 0.8; white-space: pre; }
      .etiqueta { position: fixed; transform: translate(-50%, -100%); padding: 3px 7px; background: rgba(18, 24, 28, 0.86); border-radius: 2px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="palco"></div>
    <div id="legenda"></div>
    <div id="info"></div>
    <script type="module" src="./bancada.js"></script>
  </body>
</html>
